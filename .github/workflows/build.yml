```yaml
name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        shell: pwsh
        run: |
          Write-Host "Removing bun.lock (was generated on Linux)..."
          if (Test-Path "bun.lock") { Remove-Item "bun.lock" -Force }
          Write-Host "Running bun install..."
          bun install
          Write-Host "Verifying dependencies..."
          if (Test-Path "node_modules\.bin\next.cmd") {
            Write-Host "next CLI: OK"
          } else {
            Write-Host "next CLI: MISSING"
            exit 1
          }
          if (Test-Path "node_modules\.bin\tauri.cmd") {
            Write-Host "tauri CLI: OK"
          } else {
            Write-Host "tauri CLI: MISSING"
            exit 1
          }

      - name: Verify Tauri config
        shell: pwsh
        run: |
          Write-Host "Project structure:"
          Get-ChildItem -Path . | Format-Table Name, Mode
          Write-Host ""
          Write-Host "src-tauri structure:"
          if (Test-Path "src-tauri") {
            Get-ChildItem -Path src-tauri -Recurse -File | Select-Object -First 20 | Format-Table FullName
          } else {
            Write-Host "src-tauri/ folder NOT FOUND!"
            exit 1
          }

      - name: Build Tauri app
        shell: pwsh
        run: |
          Write-Host "=== Building Tauri app ==="
          Write-Host "TAURI_BUILD = $env:TAURI_BUILD"
          bun run tauri:build
        env:
          TAURI_BUILD: "1"

      - name: Locate built installers
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Build output ==="
          if (Test-Path "src-tauri\target\release\bundle") {
            Write-Host "Bundle folder contents:"
            Get-ChildItem -Recurse "src-tauri\target\release\bundle" | Format-Table FullName, Length
          } else {
            Write-Host "Bundle folder not found at src-tauri\target\release\bundle"
            Write-Host ""
            Write-Host "Checking what's in src-tauri\target\release:"
            if (Test-Path "src-tauri\target\release") {
              Get-ChildItem "src-tauri\target\release" | Format-Table Name, Length
            }
          }

      - name: Upload MSI installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Host-MSI-Installer
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Upload NSIS installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Host-NSIS-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload portable exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Host-Portable-Exe
          path: src-tauri/target/release/beammp-host.exe
          if-no-files-found: warn
          retention-days: 30
```
