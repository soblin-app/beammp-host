[package]
name = "beammp-host"
version = "0.1.0"
description = "Host a BeamMP server on your PC and expose it via playit.gg"
authors = ["BeamMP Host"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "beammp_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json", "stream"] }
dirs = "5"
toml = "0.8"
anyhow = "1"
thiserror = "1"
regex = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
open = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
